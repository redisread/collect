name: Collect
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    COLLECT_API_URL: https://collect.jiahongw.com
    COLLECT_APP_GROUP: group.com.example.collect
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CollectAPIURL: $(COLLECT_API_URL)
    INFOPLIST_KEY_CollectAppGroup: $(COLLECT_APP_GROUP)
targets:
  Collect:
    type: application
    platform: iOS
    sources: [Collect, Shared]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Collect
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Collect/Info.plist
      properties:
        CollectAPIURL: $(COLLECT_API_URL)
        CollectAppGroup: $(COLLECT_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [collect]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.collect.refresh]
    entitlements:
      path: Collect/Collect.entitlements
      properties:
        com.apple.security.application-groups: [$(COLLECT_APP_GROUP)]
    dependencies:
      - target: CollectWidgets
  CollectWidgets:
    type: app-extension
    platform: iOS
    sources: [CollectWidgets, Shared]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collect.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: CollectWidgets/Info.plist
      properties:
        CollectAppGroup: $(COLLECT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CollectWidgets/CollectWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(COLLECT_APP_GROUP)]
  CollectTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CollectTests]
    dependencies:
      - target: Collect
  CollectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CollectUITests]
    dependencies:
      - target: Collect
schemes:
  Collect:
    build:
      targets:
        Collect: all
        CollectWidgets: all
    test:
      targets: [CollectTests, CollectUITests]
