name: Cloudflare Full-stack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify unified Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check generated Cloudflare bindings
        run: pnpm --filter frontend cf-typecheck
      - name: Type-check API
        run: pnpm --filter api lint
      - name: Test API
        run: pnpm --filter api test
      - name: Type-check frontend
        run: pnpm --filter frontend type-check
      - name: Test frontend
        run: pnpm --filter frontend test
      - name: Build unified Worker
        run: pnpm --filter frontend build
      - name: Validate Wrangler deployment bundle
        run: pnpm --filter frontend exec wrangler deploy --dry-run

  deploy:
    name: Deploy unified Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unified Worker
        run: pnpm --filter frontend build
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
